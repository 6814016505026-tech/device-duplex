<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบประเภทการสื่อสารข้อมูล (Data Communication)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-yellow: #FFF3CD;
            --pastel-orange: #FFD8A8;
            --white: #FFFFFF;
            --text-main: #495057;
            --text-light: #868E96;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, var(--pastel-yellow) 0%, var(--pastel-orange) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px var(--shadow);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #E8590C;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-family: 'Prompt', sans-serif;
            border: 2px solid var(--pastel-yellow);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--pastel-orange);
        }

        button {
            background-color: var(--pastel-orange);
            color: #D9480F;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        button:hover {
            background-color: #FFC078;
            transform: translateY(-2px);
        }

        #resultArea {
            margin-top: 25px;
            padding: 20px;
            border-radius: 16px;
            background-color: #F8F9FA;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
            text-align: left;
        }

        #resultArea.active {
            display: block;
        }

        .result-type {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2B8A3E;
        }

        .result-desc {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ระบบตรวจสอบประเภทการสื่อสาร</h1>
        <p class="subtitle">ตรวจสอบอุปกรณ์เครือข่าย (Simplex, Half-duplex, Full-duplex)</p>

        <form id="checkForm">
            <input type="text" id="deviceInput" placeholder="เช่น วิทยุสื่อสาร, สวิตช์, เมาส์, โทรศัพท์..." autocomplete="off" required>
            <button type="submit">วิเคราะห์อุปกรณ์</button>
        </form>

        <div id="resultArea"></div>
    </div>

    <script>
        // --- ฐานข้อมูลจำลอง (Local Database) ---
        const database = {
            simplex: [
                "คีย์บอร์ด", "keyboard", "เมาส์", "mouse", "จอภาพ", "monitor", "จอคอม", "ปริ้นเตอร์", "printer", "เครื่องพิมพ์",
                "วิทยุ", "radio", "ทีวี", "tv", "television", "โทรทัศน์", "กล้องวงจรปิด", "cctv", "เซนเซอร์", "sensor",
                "ลำโพง", "speaker", "ไมโครโฟน", "microphone", "ไมค์", "เครื่องสแกน", "scanner", "รีโมท", "remote",
                "บาร์โค้ด", "barcode", "โปรเจคเตอร์", "projector", "ไฟจราจร", "สัญญาณเตือนไฟไหม้", "fire alarm", "จีพีเอส", "gps",
                "เพจเจอร์", "pager", "webcam", "กล้องเว็บแคม", "rfid", "บัตรคีย์การ์ด", "เครื่องรูดบัตร", "คีย์แพด", "keypad"
            ],
            halfDuplex: [
                "วิทยุสื่อสาร", "walkie-talkie", "วอ", "แฟกซ์", "fax", "เครื่องส่งแฟกซ์", "ฮับ", "hub", "บลูทูธ", "bluetooth",
                "wi-fi", "wifi", "ไวไฟ", "สายแลนแบบเก่า", "cb radio", "วิทยุตำรวจ", "วิทยุสมัครเล่น", "ham radio", "usb",
                "เครื่องส่งโทรเลข", "telegraph", "เครื่องอ่านสมาร์ทการ์ด", "smart card reader", "nfc", "อินฟราเรด", "infrared"
            ],
            fullDuplex: [
                "โทรศัพท์", "telephone", "โทรศัพท์บ้าน", "สมาร์ทโฟน", "smartphone", "มือถือ", "โทรศัพท์มือถือ",
                "สวิตช์", "switch", "เราเตอร์", "router", "สายแลน", "lan", "ethernet", "ไฟเบอร์ออปติก", "fiber optic",
                "โมเด็ม", "modem", "วิดีโอคอล", "video call", "skype", "discord", "zoom", "สายโทรศัพท์", "คอมพิวเตอร์", "computer",
                "โน้ตบุ๊ก", "notebook", "laptop", "เซิร์ฟเวอร์", "server", "ดาวเทียมแบบสองทาง", "5g", "4g", "LTE"
            ]
        };

        const explanations = {
            simplex: "เป็นแบบ **Simplex (ทิศทางเดียว)**<br><br><b>เหตุผล:</b> ข้อมูลสามารถส่งไปได้เพียงทิศทางเดียวเท่านั้น ผู้ส่งจะเป็นผู้ส่งเสมอ และผู้รับก็จะเป็นผู้รับเสมอ ไม่สามารถโต้ตอบกลับได้",
            halfDuplex: "เป็นแบบ **Half-duplex (กึ่งสองทิศทาง)**<br><br><b>เหตุผล:</b> ข้อมูลสามารถส่งและรับได้ทั้งสองทิศทาง แต่ไม่สามารถทำในเวลาเดียวกันได้ ต้องสลับกันส่งและรับ (ผลัดกันพูด)",
            fullDuplex: "เป็นแบบ **Full-duplex (สองทิศทาง)**<br><br><b>เหตุผล:</b> ข้อมูลสามารถส่งและรับได้ทั้งสองทิศทางในเวลาเดียวกัน ทำให้สามารถสื่อสารโต้ตอบกันได้อย่างต่อเนื่องทันทีโดยไม่ต้องรอ"
        };

        document.getElementById('checkForm').addEventListener('submit', function (e) {
            e.preventDefault(); 
            const input = document.getElementById('deviceInput').value.trim().toLowerCase();
            const resultArea = document.getElementById('resultArea');
            
            if (input === "") return;

            let resultType = "";
            let resultDesc = "";

            // ค้นหาในฐานข้อมูล
            if (database.simplex.some(d => input.includes(d))) {
                resultType = "ผลการวิเคราะห์:";
                resultDesc = `อุปกรณ์ "${input}" ${explanations.simplex}`;
            } else if (database.halfDuplex.some(d => input.includes(d))) {
                resultType = "ผลการวิเคราะห์:";
                resultDesc = `อุปกรณ์ "${input}" ${explanations.halfDuplex}`;
            } else if (database.fullDuplex.some(d => input.includes(d))) {
                resultType = "ผลการวิเคราะห์:";
                resultDesc = `อุปกรณ์ "${input}" ${explanations.fullDuplex}`;
            } else {
                resultType = "ไม่พบข้อมูล 😅";
                resultDesc = `ขออภัย ไม่พบ "${input}" ในฐานข้อมูลของเรา หรือสิ่งนี้อาจไม่ใช่อุปกรณ์เครือข่าย/อุปกรณ์สื่อสาร ลองพิมพ์คำอื่นดูนะครับ`;
                resultArea.querySelector('.result-type').style.color = "#E8590C";
            }

            resultArea.innerHTML = `
                <div class="result-type">${resultType}</div>
                <div class="result-desc">${resultDesc}</div>
            `;
            
            resultArea.classList.remove('active');
            void resultArea.offsetWidth;
            resultArea.classList.add('active');
        });
    </script>
</body>
</html>
