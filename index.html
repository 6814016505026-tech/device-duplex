<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตรวจสอบประเภทการสื่อสารข้อมูล (Data Communication)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pastel-yellow: #FFF3CD;
            --pastel-orange: #FFD8A8;
            --white: #FFFFFF;
            --text-main: #495057;
            --text-light: #868E96;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, var(--pastel-yellow) 0%, var(--pastel-orange) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px var(--shadow);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            color: #E8590C;
            /* เข้มขึ้นเล็กน้อยเพื่อให้อ่านง่าย */
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-family: 'Prompt', sans-serif;
            border: 2px solid var(--pastel-yellow);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--pastel-orange);
        }

        button {
            background-color: var(--pastel-orange);
            color: #D9480F;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        button:hover {
            background-color: #FFC078;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #resultArea {
            margin-top: 25px;
            padding: 20px;
            border-radius: 16px;
            background-color: #F8F9FA;
            display: none;
            /* ซ่อนไว้ก่อน */
            animation: fadeIn 0.4s ease-in-out;
        }

        #resultArea.active {
            display: block;
        }

        .result-type {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        .error {
            color: #FA5252;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>ระบบถาม-ตอบด้วย AI</h1>
        <p class="subtitle">พิมพ์คำถามที่คุณอยากรู้ แล้วให้ AI ช่วยตอบ</p>

        <form id="checkForm">
            <input type="text" id="deviceInput" placeholder="พิมพ์คำถามของคุณที่นี่..." autocomplete="off" required>
            <button type="submit">ถาม AI</button>
        </form>

        <!-- กล่องสำหรับแจ้งเตือนให้ใส่ API Key -->
        <div id="apiKeyWarning" style="margin-top: 15px; font-size: 0.85rem; color: #E8590C;">
            * สำหรับนักพัฒนา: อย่าลืมใส่ Gemini API Key ในโค้ดก่อนใช้งานจริง
        </div>

        <div id="resultArea">
            <!-- ผลลัพธ์จะแสดงที่นี่ผ่าน JavaScript -->
        </div>
    </div>

    <script>
        // ใส่ API Key ของคุณที่นี่
        const API_KEY = "sk_lIY2xXc9lxL4DlSWC7rNuJtEL3lazwuGe69LLnr0LiJd9qTfbGSC8vaqvwJnQqsa";

        document.getElementById('checkForm').addEventListener('submit', async function (e) {
            e.preventDefault(); // ป้องกันการรีเฟรชหน้าเว็บ

            const inputElement = document.getElementById('deviceInput');
            const resultArea = document.getElementById('resultArea');
            const submitButton = document.querySelector('button[type="submit"]');
            let userInput = inputElement.value.trim();

            if (userInput === "") return;

            if (API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                resultArea.innerHTML = `
                    <div class="result-type error">⚠️ ยังไม่ได้ตั้งค่า API Key</div>
                    <div class="result-desc">
                        กรุณาเปิดไฟล์ \`index.html\` แล้วนำ Gemini API Key ของคุณมาใส่ในตัวแปร \`API_KEY\` ก่อนใช้งาน
                    </div>
                `;
                resultArea.classList.add('active');
                return;
            }

            // เปลี่ยนสถานะปุ่มและแสดง Loading
            submitButton.disabled = true;
            submitButton.textContent = "กำลังคิด...";
            submitButton.style.backgroundColor = "#ccc";
            submitButton.style.color = "#666";

            resultArea.innerHTML = `
                <div class="result-type" style="color: #495057;">กำลังประมวลผล...</div>
                <div class="result-desc" style="color: #868E96;">AI กำลังค้นหาคำตอบให้กับคุณ กรุณารอสักครู่</div>
            `;
            resultArea.classList.add('active');

            try {
                // เรียกใช้ ICCS Gen AI API (ผ่าน CORS Proxy เพื่อป้องกันปัญหา Failed to fetch บน Browser)
                // หมายเหตุ: ใช้ corsproxy.io เป็นตัวกลางชั่วคราว
                const response = await fetch(`https://corsproxy.io/?https://gen.ai.kku.ac.th/iccsacth/api/v1/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gemini-3.1-pro-preview",
                        messages: [
                            { role: "user", content: userInput }
                        ],
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Request failed with status ${response.status}`);
                }

                const data = await response.json();

                // ดึงข้อความตอบกลับจาก API
                let aiResponse = "";
                if (data.choices && data.choices.length > 0 && data.choices[0].message) {
                    aiResponse = data.choices[0].message.content;
                } else {
                    aiResponse = "ขออภัย ไม่สามารถสร้างคำตอบได้ในขณะนี้";
                }

                // แปลง \n เป็น <br> เพื่อให้ขึ้นบรรทัดใหม่ใน HTML
                aiResponse = aiResponse.replace(/\\n/g, '<br>');

                // แสดงผลลัพธ์
                resultArea.innerHTML = `
                    <div class="result-type" style="color: #2B8A3E;">คำตอบจาก AI:</div>
                    <div class="result-desc" style="text-align: left; margin-top: 10px;">
                        ${aiResponse}
                    </div>
                `;
            } catch (error) {
                console.error(error);
                resultArea.innerHTML = `
                    <div class="result-type error">❌ เกิดข้อผิดพลาด</div>
                    <div class="result-desc">
                        ไม่สามารถเชื่อมต่อกับ AI ได้ กรุณาลองใหม่อีกครั้ง หรือตรวจสอบ API Key<br>
                        <small style="color: #888;">${error.message}</small>
                    </div>
                `;
            } finally {
                // คืนค่าสถานะปุ่ม
                submitButton.disabled = false;
                submitButton.textContent = "ถาม AI";
                submitButton.style.backgroundColor = "";
                submitButton.style.color = "";

                // Trigger reflow เพื่อให้ Animation เล่นใหม่ (ถ้ามี)
                resultArea.classList.remove('active');
                void resultArea.offsetWidth;
                resultArea.classList.add('active');
            }
        });
    </script>
</body>

</html>
